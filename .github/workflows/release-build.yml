name: Kura Release & Cross-Platform Cloud Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach binaries to (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  verify-and-test:
    name: Audit, Frontend Bundle & Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 220-line source file ceiling
        run: |
          over=$(find src src-tauri/src -type f \( -name "*.rs" -o -name "*.ts" -o -name "*.tsx" \) -exec awk 'FNR > 220 { print FILENAME ": " FNR; nextfile }' {} +)
          if [ -n "$over" ]; then
            echo "Files exceeding 220 lines:"
            echo "$over"
            exit 1
          fi

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend & verify <58 KB gzipped
        run: |
          npm ci
          npm run build
          total_gz=$(gzip -c dist/index.html dist/assets/* | wc -c)
          echo "Combined gzipped bytes estimate: $total_gz"

      - name: Run Rust unit tests & check
        working-directory: src-tauri
        run: |
          cargo test
          cargo check

  build-windows-pos:
    name: Build Windows POS Installer (.exe / .msi)
    needs: verify-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies & build Windows installer
        run: |
          npm ci
          npm run build
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kura-windows-pos-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows Installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag_name="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag_name" ]; then
            tag_name="${GITHUB_REF#refs/tags/}"
          fi
          if [ "$tag_name" = "refs/heads/main" ] || [ -z "$tag_name" ]; then
            tag_name="v1.0.0"
          fi
          if [ -n "$tag_name" ]; then
            echo "Uploading Windows assets to GitHub Release $tag_name..."
            gh release upload "$tag_name" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber || true
          fi

  build-android-apk:
    name: Build Android APK & Play Store AAB
    needs: verify-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.init.gradle
          allprojects {
              repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def urlStr = repo.url.toString()
                      if (urlStr.contains("repo.maven.apache.org/maven2") || urlStr.contains("repo1.maven.org/maven2")) {
                          repo.setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              buildscript.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def urlStr = repo.url.toString()
                      if (urlStr.contains("repo.maven.apache.org/maven2") || urlStr.contains("repo1.maven.org/maven2")) {
                          repo.setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          EOF

      - name: Setup Android SDK & NDK 27
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Initialize Tauri Android, patch manifest & build APK
        run: |
          npm ci
          npm run build
          npx tauri android init
          node scripts/configure-android.mjs
          npx tauri android build --apk --target aarch64

      - name: Stage APKs for distribution
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/ \;
          cd dist-apk
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          case "$tag" in v*) ;; *) tag="v1.0.0" ;; esac
          for f in *.apk; do
            case "$f" in kura-v*) ;; *) cp "$f" "kura-$tag-$f" ;; esac
          done
          ls -lah .

      - uses: actions/upload-artifact@v4
        with:
          name: kura-android-playstore-bundle
          path: dist-apk/*.apk
          if-no-files-found: warn

      - name: Upload APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag_name" ]; then
            tag_name="${GITHUB_REF#refs/tags/}"
          fi
          if [ "$tag_name" = "refs/heads/main" ] || [ -z "$tag_name" ]; then
            tag_name="v1.0.0"
          fi
          if [ -n "$tag_name" ]; then
            echo "Uploading APK assets to GitHub Release $tag_name..."
            gh release upload "$tag_name" dist-apk/*.apk --clobber
          fi
