name: Kura Release & Cross-Platform Cloud Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: Audit, Frontend Bundle & Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 220-line source file ceiling
        run: |
          over=$(find src src-tauri/src -type f \( -name "*.rs" -o -name "*.ts" -o -name "*.tsx" \) -exec awk 'END { if (NR > 220) printf "%s:%d\n", FILENAME, NR }' {} +)
          if [ -n "$over" ]; then
            echo "Files exceeding 220 lines:"
            echo "$over"
            exit 1
          fi

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend & verify <50 KB gzipped
        run: |
          npm ci
          npm run build
          total_gz=$(gzip -c dist/index.html dist/assets/* | wc -c)
          echo "Combined gzipped bytes estimate: $total_gz"

      - name: Run Rust unit tests & check
        working-directory: src-tauri
        run: |
          cargo test
          cargo check

  build-windows-pos:
    name: Build Windows POS Installer (.exe / .msi)
    needs: verify-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies & build Windows installer
        run: |
          npm ci
          npm run build
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kura-windows-pos-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android-apk:
    name: Build Android APK & Play Store AAB
    needs: verify-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34 & NDK 27
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Initialize Tauri Android, patch manifest & build APK/AAB
        run: |
          npm ci
          npm run build
          npx tauri android init
          npm run android:prep
          npx tauri android build --apk --aab

      - uses: actions/upload-artifact@v4
        with:
          name: kura-android-playstore-bundle
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
