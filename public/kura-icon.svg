<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="kuraBg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="52%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="kuraGlow" cx="0.5" cy="0.34" r="0.58">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="kuraRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="shikkuiWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="kirizumaSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <clipPath id="wallClip">
      <path d="M292 406 H732 V788 C732 812 712 832 688 832 H336 C312 832 292 812 292 788 Z" />
    </clipPath>
  </defs>

  <!-- Outer Apple Squircle Canvas -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#kuraBg)" />
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#kuraGlow)" />
  <rect x="33" y="33" width="958" height="958" rx="227" fill="none" stroke="url(#kuraRim)" stroke-width="2" />

  <!-- Onigawara Ornamental Ridge Cap -->
  <rect x="424" y="168" width="176" height="32" rx="14" fill="#F8FAFC" />
  <rect x="398" y="194" width="228" height="22" rx="10" fill="#CBD5E1" />

  <!-- Kirizuma Stepped Gable Roof -->
  <polygon points="512,202 824,386 792,414 232,414 200,386" fill="url(#kirizumaSlate)" />
  <polygon points="512,202 824,386 806,404 512,226 218,404 200,386" fill="#F8FAFC" />
  <rect x="260" y="392" width="504" height="20" rx="9" fill="#F8FAFC" />

  <!-- Shikkui White Plaster Storehouse Body & Namako-kabe Diamond Skirt -->
  <g clip-path="url(#wallClip)">
    <rect x="292" y="406" width="440" height="426" fill="url(#shikkuiWall)" />
    <rect x="292" y="406" width="440" height="26" fill="#0F172A" opacity="0.14" />
    <rect x="292" y="726" width="440" height="106" fill="#CBD5E1" opacity="0.45" />
    <path d="M292 780 L346 726 L400 780 L346 834 Z M400 780 L454 726 L508 780 L454 834 Z M516 780 L570 726 L624 780 L570 834 Z M624 780 L678 726 L732 780 L678 834 Z" fill="#94A3B8" opacity="0.55" />
  </g>

  <!-- Vault Doorway & Interlocking Sync Rings -->
  <rect x="404" y="514" width="216" height="318" rx="34" fill="#0F172A" />
  <rect x="412" y="522" width="200" height="302" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />
  <circle cx="484" cy="672" r="50" fill="none" stroke="#007AFF" stroke-width="18" />
  <circle cx="540" cy="672" r="50" fill="none" stroke="#34C759" stroke-width="18" />
  <circle cx="512" cy="672" r="10" fill="#F8FAFC" />
</svg>
